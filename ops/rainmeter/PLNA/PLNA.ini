; ============================================================
;  PLNA 바탕화면 위젯 (Rainmeter)
;
;  오늘의 습관 진행률 · 남은 할 일 · 이번 주 목표를 바탕화면에 띄운다.
;  서버가 그린 PNG(/api/widget/image)를 주기적으로 내려받아 표시하는 방식.
;
;  설치 방법은 ops/rainmeter/README.md 참고.
;  아래 [Variables]의 Token 한 줄만 본인 값으로 바꾸면 된다.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
ContextTitle="지금 새로고침"
ContextAction=[!CommandMeasure MeasureWidget "Update"]

[Metadata]
Name=PLNA 위젯
Information=오늘의 습관 진행률·남은 할 일·이번 주 목표를 바탕화면에 표시한다.
Version=1.0

[Variables]
; ---------- 여기만 바꾸면 된다 ----------
; Vercel 환경변수 PLNA_WIDGET_TOKEN 에 넣은 값과 똑같이 적는다. 꺾쇠 < > 는 넣지 않는다.
Token=YOUR_WIDGET_TOKEN
; 배경화면이 어두우면 dark, 밝으면 light
Theme=light
; ---------------------------------------

; 바탕화면에 보일 크기
DisplayWidth=500
DisplayHeight=250
; 실제로 내려받는 크기. 글자가 또렷하도록 보이는 크기의 2배로 둔다.
RenderWidth=1000
RenderHeight=500
; 새로고침 주기(초). 서버 캐시가 300초라 900초(15분)보다 짧게 잡아도 의미 없다.
RefreshSeconds=900

Site=https://plna.vercel.app

[MeasureWidget]
Measure=Plugin
Plugin=WebParser
URL=#Site#/api/widget/image?token=#Token#&w=#RenderWidth#&h=#RenderHeight#&theme=#Theme#
Download=1
UpdateRate=#RefreshSeconds#
FinishAction=[!HideMeter MeterError][!UpdateMeter MeterWidget][!Redraw]
OnConnectErrorAction=[!SetOption MeterError Text "PLNA에 연결하지 못했습니다.#CRLF#인터넷 연결을 확인하세요."][!ShowMeter MeterError][!Redraw]
OnDownloadErrorAction=[!SetOption MeterError Text "위젯 이미지를 받지 못했습니다.#CRLF#Token 값이 맞는지 확인하세요."][!ShowMeter MeterError][!Redraw]

[MeterWidget]
Meter=Image
MeasureName=MeasureWidget
X=0
Y=0
W=#DisplayWidth#
H=#DisplayHeight#
PreserveAspectRatio=1
ToolTipText=클릭하면 PLNA가 열립니다
LeftMouseUpAction=["#Site#/"]

[MeterError]
Meter=String
X=14
Y=14
W=(#DisplayWidth#-28)
H=(#DisplayHeight#-28)
FontSize=11
FontColor=220,70,70,255
SolidColor=20,20,24,215
ClipString=1
Hidden=1
Text=
