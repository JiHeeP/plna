; PLNA desktop widget for Rainmeter
;
; Shows today's habit progress, remaining todos and this week's goal.
; It downloads the PNG rendered by /api/widget/image and draws it on the desktop.
;
; Setup and troubleshooting: see ops/rainmeter/README.md
; Only the Token line below needs to be changed.
;
; This file is intentionally ASCII only so that it can be created by
; copy-pasting into Notepad without any encoding trouble.

[Rainmeter]
Update=1000
AccurateText=1
ContextTitle="Refresh now"
ContextAction=[!CommandMeasure MeasureWidget "Update"]

[Metadata]
Name=PLNA Widget
Information=Shows today's habit progress, remaining todos and this week's goal.
Version=1.1

[Variables]
; ---------- change this line only ----------
; Same value as the PLNA_WIDGET_TOKEN environment variable on Vercel.
; Do not include angle brackets.
Token=YOUR_WIDGET_TOKEN
; light or dark, depending on your wallpaper
Theme=light
; -------------------------------------------

; size shown on the desktop
DisplayWidth=500
DisplayHeight=250
; size actually downloaded; keep it 2x the display size for crisp text
RenderWidth=1000
RenderHeight=500
; refresh interval in seconds; the server caches for 300s so below 900 is pointless
RefreshSeconds=900

Site=https://plna.vercel.app

[MeasureWidget]
Measure=Plugin
Plugin=WebParser
URL=#Site#/api/widget/image?token=#Token#&w=#RenderWidth#&h=#RenderHeight#&theme=#Theme#
Download=1
; DownloadFile is required here. The URL ends in a query string, so without an
; explicit name the saved file has no .png extension and the Image meter cannot
; read it - the download succeeds but nothing is ever drawn.
DownloadFile=widget.png
UpdateRate=#RefreshSeconds#
FinishAction=[!HideMeter MeterStatus][!ShowMeter MeterWidget][!UpdateMeter MeterWidget][!Redraw]
OnConnectErrorAction=[!SetOption MeterStatus Text "PLNA: cannot reach the server.#CRLF#Check your internet connection."][!HideMeter MeterWidget][!ShowMeter MeterStatus][!Redraw]
OnDownloadErrorAction=[!SetOption MeterStatus Text "PLNA: download failed.#CRLF#Check the Token value."][!HideMeter MeterWidget][!ShowMeter MeterStatus][!Redraw]

[MeterWidget]
Meter=Image
MeasureName=MeasureWidget
X=0
Y=0
W=#DisplayWidth#
H=#DisplayHeight#
PreserveAspectRatio=1
ToolTipText=Click to open PLNA
LeftMouseUpAction=["#Site#/"]
Hidden=1

; Visible from the moment the skin loads, so that "nothing on screen" always
; means the skin itself did not load, never that it loaded but drew nothing.
[MeterStatus]
Meter=String
X=0
Y=0
W=#DisplayWidth#
H=#DisplayHeight#
SolidColor=20,20,24,225
FontColor=245,245,245,255
FontSize=12
Padding=16,16,16,16
ClipString=1
Text=PLNA widget: loading...
