name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  scan-secrets-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tracked files for secrets
        run: npm run check:secrets

      - name: Lint
        run: npm run lint
